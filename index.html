<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DocTalk — Ask your files anything</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        /* ── Reset & Variables ─────────────────────────────── */
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg:        #0e0f11;
            --surface:   #16181c;
            --border:    #2a2d34;
            --border-hi: #3e4250;
            --accent:    #c8f060;
            --accent-dim:#8faa3a;
            --text:      #e8eaf0;
            --muted:     #7a7e8d;
            --danger:    #ff6b6b;
            --info:      #6bb5ff;
            --radius:    12px;
            --mono:      'DM Mono', monospace;
            --serif:     'Instrument Serif', Georgia, serif;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: var(--mono);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 48px 20px 80px;
            /* subtle grain texture */
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
        }

        /* ── Header ────────────────────────────────────────── */
        header {
            text-align: center;
            margin-bottom: 48px;
            animation: fadeUp 0.6s ease both;
        }
        .logo {
            font-family: var(--serif);
            font-size: clamp(2.2rem, 5vw, 3.4rem);
            letter-spacing: -0.02em;
            line-height: 1;
            color: var(--text);
        }
        .logo span { color: var(--accent); font-style: italic; }
        .tagline {
            font-size: 0.78rem;
            color: var(--muted);
            letter-spacing: 0.12em;
            text-transform: uppercase;
            margin-top: 10px;
        }

        /* ── Main card ─────────────────────────────────────── */
        .card {
            width: 100%;
            max-width: 680px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            overflow: hidden;
            animation: fadeUp 0.6s 0.1s ease both;
        }

        /* ── Upload zone ───────────────────────────────────── */
        .upload-zone {
            padding: 32px;
            border-bottom: 1px solid var(--border);
        }
        .section-label {
            font-size: 0.68rem;
            letter-spacing: 0.16em;
            text-transform: uppercase;
            color: var(--muted);
            margin-bottom: 16px;
        }
        .drop-target {
            border: 1.5px dashed var(--border-hi);
            border-radius: 8px;
            padding: 28px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            transition: border-color 0.2s, background 0.2s;
            position: relative;
        }
        .drop-target:hover, .drop-target.drag-over {
            border-color: var(--accent);
            background: rgba(200, 240, 96, 0.04);
        }
        .drop-target input[type="file"] {
            position: absolute;
            inset: 0;
            opacity: 0;
            cursor: pointer;
            width: 100%;
            height: 100%;
        }
        .drop-icon {
            font-size: 2rem;
            line-height: 1;
        }
        .drop-text {
            font-size: 0.82rem;
            color: var(--muted);
        }
        .drop-text strong { color: var(--accent); font-weight: 500; }
        .file-badge {
            display: none;
            align-items: center;
            gap: 8px;
            background: rgba(200, 240, 96, 0.08);
            border: 1px solid var(--accent-dim);
            border-radius: 6px;
            padding: 8px 14px;
            font-size: 0.78rem;
            color: var(--accent);
            margin-top: 12px;
        }
        .file-badge.visible { display: flex; }
        .file-badge .remove-file {
            margin-left: auto;
            cursor: pointer;
            color: var(--muted);
            font-size: 1rem;
            line-height: 1;
            transition: color 0.15s;
        }
        .file-badge .remove-file:hover { color: var(--danger); }

        /* ── Buttons ───────────────────────────────────────── */
        .btn {
            font-family: var(--mono);
            font-size: 0.8rem;
            letter-spacing: 0.08em;
            padding: 10px 22px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: opacity 0.15s, transform 0.1s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .btn:active:not(:disabled) { transform: scale(0.97); }
        .btn:disabled { opacity: 0.4; cursor: not-allowed; }
        .btn-primary {
            background: var(--accent);
            color: #0e0f11;
            font-weight: 500;
            margin-top: 16px;
            width: 100%;
            justify-content: center;
        }
        .btn-primary:hover:not(:disabled) { opacity: 0.88; }

        /* ── Toast / status ────────────────────────────────── */
        .toast {
            display: none;
            align-items: center;
            gap: 8px;
            font-size: 0.78rem;
            padding: 10px 14px;
            border-radius: 6px;
            margin-top: 14px;
        }
        .toast.visible { display: flex; }
        .toast.success { background: rgba(200,240,96,0.09); color: var(--accent); border: 1px solid var(--accent-dim); }
        .toast.error   { background: rgba(255,107,107,0.09); color: var(--danger); border: 1px solid rgba(255,107,107,0.3); }
        .toast.info    { background: rgba(107,181,255,0.09); color: var(--info);   border: 1px solid rgba(107,181,255,0.3); }

        /* ── Chat zone ─────────────────────────────────────── */
        .chat-zone {
            padding: 32px;
        }
        .chat-history {
            min-height: 80px;
            max-height: 380px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-bottom: 20px;
            scrollbar-width: thin;
            scrollbar-color: var(--border) transparent;
        }
        .chat-history:empty::after {
            content: "Answers will appear here…";
            color: var(--muted);
            font-size: 0.78rem;
            font-style: italic;
            display: block;
            padding: 16px 0;
        }
        .bubble {
            padding: 14px 18px;
            border-radius: 8px;
            font-size: 0.84rem;
            line-height: 1.65;
            animation: fadeUp 0.3s ease both;
        }
        .bubble.q {
            background: rgba(255,255,255,0.04);
            border: 1px solid var(--border);
            border-left: 3px solid var(--muted);
            color: var(--muted);
        }
        .bubble.q::before { content: "you · "; font-size: 0.68rem; letter-spacing: 0.1em; display: block; margin-bottom: 4px; color: var(--border-hi); }
        .bubble.a {
            background: rgba(200,240,96,0.05);
            border: 1px solid rgba(200,240,96,0.15);
            border-left: 3px solid var(--accent);
            color: var(--text);
        }
        .bubble.a::before { content: "doc · "; font-size: 0.68rem; letter-spacing: 0.1em; display: block; margin-bottom: 4px; color: var(--accent-dim); }

        /* ── Input row ─────────────────────────────────────── */
        .input-row {
            display: flex;
            gap: 10px;
        }
        .input-row input {
            flex: 1;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text);
            font-family: var(--mono);
            font-size: 0.82rem;
            padding: 11px 14px;
            outline: none;
            transition: border-color 0.2s;
        }
        .input-row input::placeholder { color: var(--muted); }
        .input-row input:focus { border-color: var(--accent); }
        .input-row input:disabled { opacity: 0.4; cursor: not-allowed; }
        .btn-ask {
            background: var(--accent);
            color: #0e0f11;
            font-weight: 500;
            padding: 11px 20px;
        }
        .btn-ask:hover:not(:disabled) { opacity: 0.88; }

        /* ── Spinner ───────────────────────────────────────── */
        .spinner {
            display: inline-block;
            width: 14px; height: 14px;
            border: 2px solid rgba(0,0,0,0.3);
            border-top-color: #0e0f11;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }

        /* ── Session indicator ─────────────────────────────── */
        .session-bar {
            display: none;
            font-size: 0.7rem;
            color: var(--muted);
            padding: 10px 32px;
            border-top: 1px solid var(--border);
            background: rgba(255,255,255,0.015);
            align-items: center;
            gap: 8px;
        }
        .session-bar.visible { display: flex; }
        .session-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); display: inline-block; }

        /* ── Animations ────────────────────────────────────── */
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(14px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

<header>
    <div class="logo">Doc<span>Talk</span></div>
    <p class="tagline">Ask your files anything</p>
</header>

<div class="card">

    <!-- Upload section -->
    <div class="upload-zone">
        <p class="section-label">01 — Upload a file</p>

        <div class="drop-target" id="dropTarget">
            <input type="file" id="fileInput" accept="*/*">
            <div class="drop-icon">📄</div>
            <p class="drop-text"><strong>Click to browse</strong> or drag &amp; drop</p>
            <p class="drop-text">PDF, DOCX, XLSX, TXT, CSV, JSON, code files — max 10 MB</p>
        </div>

        <div class="file-badge" id="fileBadge">
            <span>📎</span>
            <span id="fileName"></span>
            <span id="fileSize" style="color:var(--muted);margin-left:4px;"></span>
            <span class="remove-file" id="removeFile" title="Remove file">✕</span>
        </div>

        <button class="btn btn-primary" id="uploadBtn" disabled>Upload &amp; Process</button>

        <div class="toast" id="uploadToast"></div>
    </div>

    <!-- Chat section -->
    <div class="chat-zone">
        <p class="section-label">02 — Ask a question</p>

        <div class="chat-history" id="chatHistory"></div>

        <div class="input-row">
            <input type="text" id="questionInput" placeholder="What does this document say about…" disabled>
            <button class="btn btn-ask" id="askBtn" disabled>Ask</button>
        </div>
    </div>

    <!-- Session bar -->
    <div class="session-bar" id="sessionBar">
        <span class="session-dot"></span>
        <span>Session active · ID: <span id="sessionShort"></span></span>
    </div>

</div>

<script>
    // ── Config ────────────────────────────────────────────────
    const API_BASE = "http://127.0.0.1:8000";

    // ── State ─────────────────────────────────────────────────
    let sessionId   = sessionStorage.getItem("doctalk_session") || null;
    let busy        = false;
    let selectedFile = null;

    // ── Elements ──────────────────────────────────────────────
    const dropTarget    = document.getElementById("dropTarget");
    const fileInput     = document.getElementById("fileInput");
    const fileBadge     = document.getElementById("fileBadge");
    const fileNameEl    = document.getElementById("fileName");
    const fileSizeEl    = document.getElementById("fileSize");
    const removeFileBtn = document.getElementById("removeFile");
    const uploadBtn     = document.getElementById("uploadBtn");
    const uploadToast   = document.getElementById("uploadToast");
    const chatHistory   = document.getElementById("chatHistory");
    const questionInput = document.getElementById("questionInput");
    const askBtn        = document.getElementById("askBtn");
    const sessionBar    = document.getElementById("sessionBar");
    const sessionShort  = document.getElementById("sessionShort");

    // ── Restore session ───────────────────────────────────────
    if (sessionId) activateChat();

    // ── Drag & drop ───────────────────────────────────────────
    dropTarget.addEventListener("dragover",  e => { e.preventDefault(); dropTarget.classList.add("drag-over"); });
    dropTarget.addEventListener("dragleave", ()  => dropTarget.classList.remove("drag-over"));
    dropTarget.addEventListener("drop", e => {
        e.preventDefault();
        dropTarget.classList.remove("drag-over");
        const f = e.dataTransfer.files[0];
        if (f) setFile(f);
    });

    fileInput.addEventListener("change", () => {
        if (fileInput.files[0]) setFile(fileInput.files[0]);
    });

    removeFileBtn.addEventListener("click", () => clearFile());

    function setFile(f) {
        selectedFile = f;
        fileNameEl.textContent = f.name;
        fileSizeEl.textContent = `(${(f.size / 1024).toFixed(1)} KB)`;
        fileBadge.classList.add("visible");
        uploadBtn.disabled = false;
        hideToast(uploadToast);
    }

    function clearFile() {
        selectedFile = null;
        fileInput.value = "";
        fileBadge.classList.remove("visible");
        uploadBtn.disabled = true;
    }

    // ── Upload ────────────────────────────────────────────────
    uploadBtn.addEventListener("click", uploadFile);

    async function uploadFile() {
        if (busy || !selectedFile) return;
        busy = true;
        uploadBtn.disabled = true;
        uploadBtn.innerHTML = `<span class="spinner"></span> Processing…`;
        showToast(uploadToast, "Uploading and indexing your file…", "info");

        try {
            const form = new FormData();
            form.append("file", selectedFile);

            const res  = await fetch(`${API_BASE}/upload`, { method: "POST", body: form });
            const data = await res.json();
            if (!res.ok) throw new Error(data.detail || "Upload failed");

            sessionId = data.session_id;
            sessionStorage.setItem("doctalk_session", sessionId);

            showToast(uploadToast, "✓ File processed — ask your first question below", "success");
            activateChat();
            clearFile();
        } catch (err) {
            showToast(uploadToast, "✗ " + err.message, "error");
        } finally {
            busy = false;
            uploadBtn.disabled = false;
            uploadBtn.innerHTML = "Upload &amp; Process";
        }
    }

    // ── Ask ───────────────────────────────────────────────────
    askBtn.addEventListener("click", askQuestion);
    questionInput.addEventListener("keydown", e => {
        if (e.key === "Enter" && !askBtn.disabled) askQuestion();
    });

    async function askQuestion() {
        if (busy || !sessionId) return;
        const q = questionInput.value.trim();
        if (!q) return;

        busy = true;
        askBtn.disabled = true;
        askBtn.innerHTML = `<span class="spinner"></span>`;
        questionInput.disabled = true;

        addBubble("q", q);
        questionInput.value = "";

        try {
            const res  = await fetch(`${API_BASE}/ask`, {
                method:  "POST",
                headers: { "Content-Type": "application/json" },
                body:    JSON.stringify({ question: q, session_id: sessionId }),
            });
            const data = await res.json();

            if (res.status === 404) {
                // Session expired on server — clear local state
                sessionStorage.removeItem("doctalk_session");
                sessionId = null;
                deactivateChat();
                showToast(uploadToast, "✗ Session expired — please upload your file again", "error");
                return;
            }
            if (!res.ok) throw new Error(data.detail || "Request failed");

            addBubble("a", data.answer);
        } catch (err) {
            addBubble("a", "⚠ Error: " + err.message);
        } finally {
            busy = false;
            askBtn.disabled = false;
            askBtn.innerHTML = "Ask";
            questionInput.disabled = false;
            questionInput.focus();
        }
    }

    // ── Chat helpers ──────────────────────────────────────────
    function addBubble(type, text) {
        const div = document.createElement("div");
        div.className = `bubble ${type}`;
        div.textContent = text;
        chatHistory.appendChild(div);
        chatHistory.scrollTop = chatHistory.scrollHeight;
    }

    function activateChat() {
        questionInput.disabled = false;
        askBtn.disabled = false;
        sessionBar.classList.add("visible");
        sessionShort.textContent = sessionId.substring(0, 8) + "…";
    }

    function deactivateChat() {
        questionInput.disabled = true;
        askBtn.disabled = true;
        sessionBar.classList.remove("visible");
    }

    // ── Toast helpers ─────────────────────────────────────────
    function showToast(el, msg, type) {
        el.textContent = msg;
        el.className = `toast visible ${type}`;
    }
    function hideToast(el) {
        el.className = "toast";
        el.textContent = "";
    }
</script>

</body>
</html>

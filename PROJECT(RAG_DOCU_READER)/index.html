<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="doctalk-api-base" content="http://127.0.0.1:8000">
    <meta name="doctalk-api-key"  content="">
    <title>DocTalk — Ask your files anything</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg:        #0e0f11;
            --surface:   #16181c;
            --surface2:  #1c1f25;
            --border:    #2a2d34;
            --border-hi: #3e4250;
            --accent:    #c8f060;
            --accent-dim:#8faa3a;
            --text:      #e8eaf0;
            --muted:     #7a7e8d;
            --danger:    #ff6b6b;
            --info:      #6bb5ff;
            --radius:    12px;
            --mono:      'DM Mono', monospace;
            --serif:     'Instrument Serif', Georgia, serif;
        }

        html { scroll-behavior: smooth; }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: var(--mono);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 48px 20px 80px;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
        }

        /* ── Header ─────────────────────────────────────── */
        header {
            text-align: center;
            margin-bottom: 40px;
            animation: fadeUp 0.5s ease both;
        }
        .logo {
            font-family: var(--serif);
            font-size: clamp(2.2rem, 5vw, 3.2rem);
            letter-spacing: -0.02em;
            line-height: 1;
        }
        .logo em { color: var(--accent); font-style: italic; }
        .tagline {
            font-size: 0.72rem;
            color: var(--muted);
            letter-spacing: 0.14em;
            text-transform: uppercase;
            margin-top: 8px;
        }

        /* ── Card ───────────────────────────────────────── */
        .card {
            width: 100%;
            max-width: 700px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            overflow: hidden;
            animation: fadeUp 0.5s 0.08s ease both;
        }

        /* ── Section label ──────────────────────────────── */
        .label {
            font-size: 0.65rem;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: var(--muted);
            margin-bottom: 14px;
        }

        /* ── Upload zone ────────────────────────────────── */
        .upload-zone { padding: 28px 28px 24px; border-bottom: 1px solid var(--border); }

        .drop-area {
            border: 1.5px dashed var(--border-hi);
            border-radius: 8px;
            padding: 26px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            position: relative;
            transition: border-color 0.2s, background 0.2s;
        }
        .drop-area:hover, .drop-area.over {
            border-color: var(--accent);
            background: rgba(200,240,96,0.04);
        }
        .drop-area input[type="file"] {
            position: absolute; inset: 0;
            opacity: 0; cursor: pointer;
            width: 100%; height: 100%;
        }
        .drop-icon { font-size: 1.8rem; }
        .drop-hint { font-size: 0.8rem; color: var(--muted); }
        .drop-hint strong { color: var(--accent); font-weight: 500; }

        .file-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-top: 10px;
        }
        .file-pill {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(200,240,96,0.07);
            border: 1px solid var(--accent-dim);
            border-radius: 6px;
            padding: 7px 12px;
            font-size: 0.76rem;
            color: var(--accent);
        }
        .file-pill .x {
            margin-left: auto;
            cursor: pointer;
            color: var(--muted);
            transition: color 0.15s;
            font-size: 0.9rem;
            flex-shrink: 0;
        }
        .file-pill .x:hover { color: var(--danger); }
        .file-pill .fname { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .file-pill .fsize { color: var(--muted); flex-shrink: 0; }

        /* per-file upload result rows */
        .file-results {
            margin-top: 10px;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .file-result-row {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.72rem;
            padding: 5px 10px;
            border-radius: 5px;
            border: 1px solid transparent;
        }
        .file-result-row.ok   { background: rgba(200,240,96,0.06); border-color: rgba(200,240,96,0.15); color: var(--accent); }
        .file-result-row.skip { background: rgba(255,200,50,0.06);  border-color: rgba(255,200,50,0.2);  color: #ffc832; }
        .file-result-row.err  { background: rgba(255,107,107,0.06); border-color: rgba(255,107,107,0.2); color: var(--danger); }

        /* ── Buttons ────────────────────────────────────── */
        .btn {
            font-family: var(--mono);
            font-size: 0.78rem;
            letter-spacing: 0.07em;
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: opacity 0.15s, transform 0.1s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 7px;
        }
        .btn:active:not(:disabled) { transform: scale(0.97); }
        .btn:disabled { opacity: 0.38; cursor: not-allowed; }
        .btn-upload {
            width: 100%;
            margin-top: 14px;
            background: var(--accent);
            color: #0e0f11;
            font-weight: 500;
        }
        .btn-upload:hover:not(:disabled) { opacity: 0.86; }
        .btn-ask {
            background: var(--accent);
            color: #0e0f11;
            font-weight: 500;
            padding: 10px 18px;
            flex-shrink: 0;
        }
        .btn-ask:hover:not(:disabled) { opacity: 0.86; }
        .btn-clear {
            background: transparent;
            border: 1px solid var(--border-hi);
            color: var(--muted);
            font-size: 0.72rem;
            padding: 6px 12px;
        }
        .btn-clear:hover:not(:disabled) { border-color: var(--danger); color: var(--danger); }

        /* ── Toast ──────────────────────────────────────── */
        .toast {
            display: none;
            align-items: center;
            gap: 7px;
            font-size: 0.76rem;
            padding: 9px 13px;
            border-radius: 6px;
            margin-top: 12px;
        }
        .toast.show { display: flex; }
        .toast.ok  { background: rgba(200,240,96,0.08); color: var(--accent); border: 1px solid var(--accent-dim); }
        .toast.err { background: rgba(255,107,107,0.08); color: var(--danger); border: 1px solid rgba(255,107,107,0.3); }
        .toast.inf { background: rgba(107,181,255,0.08); color: var(--info);   border: 1px solid rgba(107,181,255,0.3); }

        /* ── Chat zone ──────────────────────────────────── */
        .chat-zone { padding: 24px 28px 28px; }

        .chat-toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 14px;
        }

        .chat-log {
            min-height: 90px;
            max-height: 420px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin-bottom: 18px;
            scrollbar-width: thin;
            scrollbar-color: var(--border) transparent;
        }
        .chat-log:empty::after {
            content: "Ask a question to begin…";
            color: var(--muted);
            font-size: 0.76rem;
            font-style: italic;
        }

        /* ── Bubbles ────────────────────────────────────── */
        .bubble {
            padding: 13px 16px;
            border-radius: 8px;
            font-size: 0.83rem;
            line-height: 1.65;
            animation: fadeUp 0.25s ease both;
            word-break: break-word;
        }
        .bubble-q {
            background: rgba(255,255,255,0.03);
            border: 1px solid var(--border);
            border-left: 3px solid var(--border-hi);
            color: var(--muted);
            white-space: pre-wrap;
        }
        .bubble-q::before {
            content: "you";
            font-size: 0.63rem;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            display: block;
            margin-bottom: 5px;
            color: var(--border-hi);
        }
        .bubble-a {
            background: rgba(200,240,96,0.04);
            border: 1px solid rgba(200,240,96,0.12);
            border-left: 3px solid var(--accent);
            color: var(--text);
        }
        .bubble-a::before {
            content: "doc";
            font-size: 0.63rem;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            display: block;
            margin-bottom: 5px;
            color: var(--accent-dim);
        }
        .bubble-a .answer-body {
            white-space: pre-wrap;
        }
        .bubble-a .sources {
            margin-top: 10px;
            padding-top: 8px;
            border-top: 1px solid rgba(200,240,96,0.12);
            font-size: 0.72rem;
            color: var(--accent-dim);
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            align-items: center;
        }
        .bubble-a .sources .src-label {
            color: var(--muted);
            letter-spacing: 0.08em;
            text-transform: uppercase;
            font-size: 0.63rem;
        }
        .bubble-a .sources .src-pill {
            background: rgba(200,240,96,0.08);
            border: 1px solid rgba(200,240,96,0.2);
            border-radius: 4px;
            padding: 2px 7px;
            font-size: 0.69rem;
            color: var(--accent);
        }
        .bubble-a.streaming .answer-body::after {
            content: "▋";
            animation: blink 0.6s step-end infinite;
            color: var(--accent);
        }
        @keyframes blink { 50% { opacity: 0; } }

        /* ── Input row ──────────────────────────────────── */
        .input-row { display: flex; gap: 9px; }
        .input-row input {
            flex: 1;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text);
            font-family: var(--mono);
            font-size: 0.81rem;
            padding: 10px 13px;
            outline: none;
            transition: border-color 0.2s;
        }
        .input-row input::placeholder { color: var(--muted); }
        .input-row input:focus { border-color: var(--accent); }
        .input-row input:disabled { opacity: 0.35; }

        /* ── Session bar ────────────────────────────────── */
        .session-bar {
            display: none;
            font-size: 0.68rem;
            color: var(--muted);
            padding: 9px 28px;
            border-top: 1px solid var(--border);
            background: rgba(255,255,255,0.012);
            align-items: center;
            gap: 7px;
        }
        .session-bar.show { display: flex; }
        .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); flex-shrink: 0; }

        /* ── Spinner ────────────────────────────────────── */
        .spin {
            display: inline-block;
            width: 13px; height: 13px;
            border: 2px solid rgba(0,0,0,0.25);
            border-top-color: #0e0f11;
            border-radius: 50%;
            animation: rotate 0.65s linear infinite;
        }

        /* ── Animations ─────────────────────────────────── */
        @keyframes fadeUp { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:translateY(0); } }
        @keyframes rotate  { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

<header>
    <div class="logo">Doc<em>Talk</em></div>
    <p class="tagline">Ask your files anything · streaming · citations</p>
</header>

<div class="card">

    <!-- ── Upload ──────────────────────────────────────── -->
    <div class="upload-zone">
        <p class="label">01 — Upload a file</p>

        <div class="drop-area" id="dropArea" role="button" aria-label="File drop zone — click to browse or drag and drop">
            <input type="file" id="fileInput" accept="*/*" multiple aria-label="Choose files to upload">
            <div class="drop-icon" aria-hidden="true">📄</div>
            <p class="drop-hint"><strong>Click to browse</strong> or drag &amp; drop</p>
            <p class="drop-hint" style="font-size:0.72rem">PDF · DOCX · XLSX · TXT · CSV · JSON · code — max 50 MB each</p>
        </div>

        <div class="file-list" id="fileList"></div>

        <button class="btn btn-upload" id="uploadBtn" disabled aria-label="Upload and process the selected file">
            Upload &amp; Process
        </button>
        <div class="toast" id="uploadToast" role="status" aria-live="polite"></div>
    </div>

    <!-- ── Chat ────────────────────────────────────────── -->
    <div class="chat-zone">
        <div class="chat-toolbar">
            <p class="label" style="margin:0">02 — Ask questions</p>
            <button class="btn btn-clear" id="clearBtn" title="Clear conversation" aria-label="Clear chat history">
                Clear chat
            </button>
        </div>

        <div class="chat-log" id="chatLog" role="log" aria-label="Conversation" aria-live="polite"></div>

        <div class="input-row">
            <input
                type="text"
                id="questionInput"
                placeholder="What does this document say about…"
                disabled
                aria-label="Ask a question about the uploaded document"
                autocomplete="off"
            >
            <button class="btn btn-ask" id="askBtn" disabled aria-label="Submit question">Ask</button>
        </div>
    </div>

    <!-- ── Session bar ──────────────────────────────────── -->
    <div class="session-bar" id="sessionBar" role="status">
        <span class="dot" aria-hidden="true"></span>
        <span>Session active · <span id="sessionId"></span></span>
        <span
            style="margin-left:auto;cursor:pointer;color:var(--danger)"
            id="endSession"
            role="button"
            tabindex="0"
            title="End session"
            aria-label="End current session"
        >✕ End</span>
    </div>

</div>

<script>
// ── Config (read from <meta> tags so this file is environment-agnostic) ───────
const API_BASE = document.querySelector('meta[name="doctalk-api-base"]')?.content || "http://127.0.0.1:8000";
const API_KEY  = document.querySelector('meta[name="doctalk-api-key"]')?.content  || "";

// ── State ─────────────────────────────────────────────────────────────────────
let sessionId       = sessionStorage.getItem("doctalk_sid") || null;
let busy            = false;
let selectedFiles   = [];   // Array<File>
let streamingBubble = null;
let streamingBody   = null;

// ── DOM refs ──────────────────────────────────────────────────────────────────
const dropArea      = document.getElementById("dropArea");
const fileInput     = document.getElementById("fileInput");
const fileList      = document.getElementById("fileList");
const uploadBtn     = document.getElementById("uploadBtn");
const uploadToast   = document.getElementById("uploadToast");
const chatLog       = document.getElementById("chatLog");
const questionInput = document.getElementById("questionInput");
const askBtn        = document.getElementById("askBtn");
const clearBtn      = document.getElementById("clearBtn");
const sessionBar    = document.getElementById("sessionBar");
const sessionIdEl   = document.getElementById("sessionId");
const endSessionEl  = document.getElementById("endSession");

// ── Init ──────────────────────────────────────────────────────────────────────
if (sessionId) activateChat();

// ── Drag & drop ───────────────────────────────────────────────────────────────
dropArea.addEventListener("dragover",  e => { e.preventDefault(); dropArea.classList.add("over"); });
dropArea.addEventListener("dragleave", ()  => dropArea.classList.remove("over"));
dropArea.addEventListener("drop", e => {
    e.preventDefault();
    dropArea.classList.remove("over");
    addFiles([...e.dataTransfer.files]);
});
fileInput.addEventListener("change", () => {
    if (fileInput.files.length) addFiles([...fileInput.files]);
});

function addFiles(incoming) {
    const existing = new Set(selectedFiles.map(f => f.name + f.size));
    incoming.forEach(f => {
        if (!existing.has(f.name + f.size)) {
            selectedFiles.push(f);
            existing.add(f.name + f.size);
        }
    });
    renderFileList();
}

function removeFileAt(idx) {
    selectedFiles.splice(idx, 1);
    renderFileList();
}

function renderFileList() {
    fileList.innerHTML = "";
    selectedFiles.forEach((f, i) => {
        const pill = document.createElement("div");
        pill.className = "file-pill";
        pill.innerHTML = `
            <span aria-hidden="true">📎</span>
            <span class="fname" title="${f.name}">${f.name}</span>
            <span class="fsize">(${(f.size / 1024).toFixed(1)} KB)</span>
            <span class="x" role="button" tabindex="0" title="Remove" aria-label="Remove ${f.name}">✕</span>
        `;
        pill.querySelector(".x").addEventListener("click",   () => removeFileAt(i));
        pill.querySelector(".x").addEventListener("keydown", e => {
            if (e.key === "Enter" || e.key === " ") removeFileAt(i);
        });
        fileList.appendChild(pill);
    });
    uploadBtn.disabled = selectedFiles.length === 0;
    if (selectedFiles.length === 0) toast(uploadToast, "", "");
}

function clearAllFiles() {
    selectedFiles = [];
    fileInput.value = "";
    renderFileList();
}

// ── Upload ────────────────────────────────────────────────────────────────────
uploadBtn.addEventListener("click", doUpload);

async function doUpload() {
    if (busy || selectedFiles.length === 0) return;
    setBusy(true, uploadBtn, `<span class="spin" aria-hidden="true"></span> Processing…`);
    toast(uploadToast, `Uploading ${selectedFiles.length} file(s)…`, "inf");

    try {
        const form = new FormData();
        selectedFiles.forEach(f => form.append("files", f));

        const res  = await apiFetch("/upload", { method: "POST", body: form });
        const data = await res.json();
        if (!res.ok) {
            const msg = data.detail?.message || data.detail || "Upload failed";
            throw new Error(msg);
        }

        sessionId = data.session_id;
        sessionStorage.setItem("doctalk_sid", sessionId);

        // Render per-file result rows below the toast
        renderFileResults(data.files || []);

        const okCount   = (data.files || []).filter(r => r.status === "ok").length;
        const skipCount = (data.files || []).filter(r => r.status !== "ok").length;
        const summary   = skipCount
            ? `✓ ${okCount} processed, ${skipCount} skipped — ask your first question`
            : `✓ ${okCount} file(s) processed — ask your first question`;
        toast(uploadToast, summary, "ok");

        activateChat();
        clearAllFiles();
    } catch (err) {
        toast(uploadToast, "✗ " + err.message, "err");
    } finally {
        setBusy(false, uploadBtn, "Upload &amp; Process");
    }
}

function renderFileResults(fileResults) {
    // Remove any previous results block
    const prev = document.getElementById("fileResultsBlock");
    if (prev) prev.remove();

    if (!fileResults.length) return;

    const block = document.createElement("div");
    block.id = "fileResultsBlock";
    block.className = "file-results";

    fileResults.forEach(r => {
        const row = document.createElement("div");
        const cls = r.status === "ok" ? "ok" : r.status === "error" ? "err" : "skip";
        row.className = `file-result-row ${cls}`;
        const icon   = r.status === "ok" ? "✓" : r.status === "error" ? "✗" : "⚠";
        const detail = r.status === "ok"
            ? `${r.chunks} chunks`
            : r.reason || r.status;
        row.textContent = `${icon} ${r.file}  —  ${detail}`;
        block.appendChild(row);
    });

    uploadBtn.insertAdjacentElement("afterend", block);
}

// ── Ask (streaming) ───────────────────────────────────────────────────────────
askBtn.addEventListener("click", doAsk);
questionInput.addEventListener("keydown", e => { if (e.key === "Enter" && !askBtn.disabled) doAsk(); });
clearBtn.addEventListener("click", () => { chatLog.innerHTML = ""; });
endSessionEl.addEventListener("click",   doEndSession);
endSessionEl.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") doEndSession(); });

async function doAsk() {
    if (busy || !sessionId) return;
    const q = questionInput.value.trim();
    if (!q) return;

    setBusy(true, askBtn, `<span class="spin" aria-hidden="true"></span>`);
    questionInput.disabled = true;
    questionInput.value = "";

    addBubble("q", q);

    const [bubble, bodyEl] = addAnswerBubble();
    streamingBubble = bubble;
    streamingBody   = bodyEl;
    bubble.classList.add("streaming");

    try {
        const res = await apiFetch("/ask", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ question: q, session_id: sessionId }),
        });

        if (res.status === 404) {
            sessionStorage.removeItem("doctalk_sid");
            sessionId = null;
            deactivateChat();
            bodyEl.textContent = "⚠ Session expired — please upload the file again.";
            bubble.classList.remove("streaming");
            return;
        }
        if (!res.ok) {
            const err = await res.json().catch(() => ({}));
            throw new Error(err.detail || "Request failed");
        }

        const reader  = res.body.getReader();
        const decoder = new TextDecoder();
        let fullText  = "";

        while (true) {
            const { done, value } = await reader.read();
            if (done) break;
            fullText += decoder.decode(value, { stream: true });
            bodyEl.textContent = fullText;
            chatLog.scrollTop  = chatLog.scrollHeight;
        }

        // FIX: use a more robust regex that anchors to end-of-string after optional
        // whitespace, preventing false matches mid-answer and handling Windows line
        // endings (\r\n). The 's' flag is not needed since we anchor to end.
        renderSources(bubble, bodyEl, fullText);

    } catch (err) {
        bodyEl.textContent = "⚠ Error: " + err.message;
    } finally {
        if (streamingBubble) streamingBubble.classList.remove("streaming");
        streamingBubble = null;
        streamingBody   = null;
        setBusy(false, askBtn, "Ask");
        questionInput.disabled = false;
        questionInput.focus();
        chatLog.scrollTop = chatLog.scrollHeight;
    }
}

/**
 * Extract "Sources: [page X], [page Y]" from raw answer text,
 * strip it from the body, and render as styled pills.
 *
 * FIX: anchored to end-of-string (\s*$) and handles \r\n so the regex
 * cannot match a mid-answer line that happens to start with "Sources:".
 * Also trims trailing whitespace from the answer body after extraction.
 */
function renderSources(bubble, bodyEl, fullText) {
    const sourceLineRe = /\r?\nSources:\s*(.+?)\s*$/;
    const match = fullText.match(sourceLineRe);
    if (!match) return;

    bodyEl.textContent = fullText.replace(sourceLineRe, "").trimEnd();

    const refs = [...match[1].matchAll(/\[([^\]]+)\]/g)].map(m => m[1]);
    if (!refs.length) return;

    const sourcesEl = document.createElement("div");
    sourcesEl.className = "sources";

    const label = document.createElement("span");
    label.className = "src-label";
    label.textContent = "Sources";
    sourcesEl.appendChild(label);

    refs.forEach(ref => {
        const pill = document.createElement("span");
        pill.className = "src-pill";
        pill.textContent = ref;
        sourcesEl.appendChild(pill);
    });

    bubble.appendChild(sourcesEl);
}

// ── End session ───────────────────────────────────────────────────────────────
async function doEndSession() {
    if (!sessionId) return;

    // FIX: disable chat controls immediately to prevent double-fire while
    // the DELETE request is in flight. Without this, rapid double-clicks
    // could fire two DELETE requests for the same session_id.
    const sid = sessionId;
    sessionId = null;
    sessionStorage.removeItem("doctalk_sid");
    deactivateChat();

    try {
        await apiFetch(`/session/${sid}`, { method: "DELETE" });
    } catch (_) { /* best-effort — session may have already expired */ }

    chatLog.innerHTML = "";
    document.getElementById("fileResultsBlock")?.remove();
    toast(uploadToast, "Session ended.", "inf");
}

// ── Helpers ───────────────────────────────────────────────────────────────────
function addBubble(type, text) {
    const d = document.createElement("div");
    d.className = `bubble bubble-${type}`;
    d.textContent = text;
    chatLog.appendChild(d);
    chatLog.scrollTop = chatLog.scrollHeight;
    return d;
}

function addAnswerBubble() {
    const bubble = document.createElement("div");
    bubble.className = "bubble bubble-a";

    const body = document.createElement("span");
    body.className = "answer-body";
    bubble.appendChild(body);

    chatLog.appendChild(bubble);
    chatLog.scrollTop = chatLog.scrollHeight;
    return [bubble, body];
}

function activateChat() {
    questionInput.disabled = false;
    askBtn.disabled = false;
    sessionBar.classList.add("show");
    sessionIdEl.textContent = sessionId.substring(0, 8) + "…";
}

function deactivateChat() {
    questionInput.disabled = true;
    askBtn.disabled = true;
    sessionBar.classList.remove("show");
}

function setBusy(state, btn, html) {
    busy = state;
    btn.disabled = state;
    btn.innerHTML = html;
}

function toast(el, msg, type) {
    el.className = type ? `toast show ${type}` : "toast";
    el.textContent = msg;
}

function apiFetch(path, opts = {}) {
    if (API_KEY) {
        opts.headers = { ...(opts.headers || {}), "x-api-key": API_KEY };
    }
    return fetch(API_BASE + path, opts);
}
</script>
